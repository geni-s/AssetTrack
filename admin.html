<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wlcm admin</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <h1>Manage All things at one place</h1>
   

    <div class="sidebar">

    <h2>Admin</h2>

    <button class="sidebtn" id="all">
        
        <span><i class="fa-solid fa-clock"></i> Pending Requests</span>
    </button>

    <button class="sidebtn" id="ak">
       
        <span><i class="fa-solid fa-circle-check"></i>Approved Assets</span>
    </button>

    <button class="sidebtn" id="want">
        
        <span><i class="fa-solid fa-plus"></i>Add Asset</span>
    </button>
    <button class="sidebtn" id="cant">
        
        <span><i class="fa-solid fa-pen-to-square"></i>Manage Assets</span>
    </button>
    <button class="sidebtn" id="ant">
        
        <span><i class="fa-solid fa-arrow-rotate-left"></i>Return Assets</span>
    </button>


</div>
    
<div class="tru">
    <div class="cards">

    <div class="card" id="totalAssets">
        Total Assets: 0
    </div>

    <div class="card" id="availableAssets">
        Available Inventory: 0
    </div>

    <div class="card" id="activeBookings">
        Active Bookings: 0
    </div>

    <div class="card" id="overdueReturns">
        Overdue Returns: 0
    </div>



</div>
   
<div class="charts">
    <div class="chart">
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart">
        <canvas id="pieChart"></canvas>
    </div>

</div>

</div>



    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="module" src="admin.js"></script>
</body>
</html>

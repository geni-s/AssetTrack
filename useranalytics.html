<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>
    <link rel="stylesheet" href="useranalytics.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Analytics Dashboard</h1>

<div class="cards">

<div class="card" id="myRequests">
    My Requests: 0
</div>

<div class="card" id="approved">
    Approved: 0
</div>

<div class="card" id="pending">
    Pending: 0
</div>

<div class="card" id="returned">
    Returned: 0
</div>




</div>
   
<div class="charts">
    <div class="chart">
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart">
        <canvas id="pieChart"></canvas>
    </div>

</div>

   

    
    <script type="module" src="useranalytics.js"></script>

</body>
</html>

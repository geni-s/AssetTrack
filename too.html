<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wlcm admin</title>
    <link rel="stylesheet" href="too.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <h1>Manage All things at one place</h1>
   

    <div class="sidebar">

    <h2>User</h2>

    <button class="sidebtn" id="all">
    <i class="fa-solid fa-box-open"></i>
      <span>Browse Assets</span>
    </button>
    
    
    <button class="sidebtn" id="kll">
        
  <i class="fa-solid fa-magnifying-glass"></i>
  <span>Find Assets</span>
    </button>


    <button class="sidebtn" id="ap">
<i class="fa-solid fa-clipboard-list"></i>
<span>Request History</span>
    </button>

    <button class="sidebtn" id="chpp">
<i class="fa-solid fa-calendar-days"></i>
<span>Due Dates</span>
    </button>



</div>

<div class="tru">
<div class="cards">

<div class="card" id="myRequests">
    My Requests: 0
</div>

<div class="card" id="approved">
    Approved: 0
</div>

<div class="card" id="pending">
    Pending: 0
</div>

<div class="card" id="returned">
    Returned: 0
</div>




</div>
   
<div class="charts">
    <div class="chart">
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart">
        <canvas id="pieChart"></canvas>
    </div>

</div>

</div>



    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="module" src="too.js"></script>
</body>
</html>
